name: Mobile Frontend CI/CD Quality & Build Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: 📱 Mobile Typecheck, Logic Test & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🔍 TypeScript Static Type Checking
        run: npx tsc --noEmit

      - name: 🧪 Run Mobile Feature Logic Tests
        run: npm test

      - name: 🏗️ Verify Expo Web Production Export / Build
        run: npx expo export -p web
